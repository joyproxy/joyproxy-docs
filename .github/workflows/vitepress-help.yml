name: Build help center (VitePress)

on:
  push:
    branches: [master, main]
    paths:
      - "help-center/**"
      - "vitepress-site/**"
      - ".github/workflows/vitepress-help.yml"
  pull_request:
    paths:
      - "help-center/**"
      - "vitepress-site/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitepress-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vitepress-site/package.json
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: help-vitepress-dist
          path: vitepress-site/.vitepress/dist
          retention-days: 14
